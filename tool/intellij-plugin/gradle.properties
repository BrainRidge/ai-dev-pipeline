# Kept in step with tool/core and tool/vscode-plugin by `npm run check:parity`.
# See spec Section 19.
pluginVersion = 0.10.0

# The IDE the plugin is built and tested against.
platformType = IC
platformVersion = 2024.3

# The supported IDE range. sinceBuild is 243 because the plugin uses the
# IntelliJ Platform Gradle Plugin 2.x toolchain and JCEF's off-screen rendering.
# untilBuild covers 2026.1 (261): every platform member the plugin touches is
# unchanged there, so the range is wider than platformVersion above. Widen it
# only alongside a `verifyPlugin` run against the new build.
pluginSinceBuild = 243
pluginUntilBuild = 261.*

org.gradle.jvmargs = -Xmx2048m
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
