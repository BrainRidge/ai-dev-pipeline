<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AI Dev Workflow — renderer harness</title>
    <link rel="stylesheet" href="../style.css" />
    <style>
      /* Stand-ins for the VS Code theme variables, so the harness is legible
         outside the extension host. */
      :root {
        --vscode-font-family: system-ui, sans-serif;
        --vscode-foreground: #ddd;
        --vscode-editor-background: #1e1e1e;
        --vscode-descriptionForeground: #999;
        --vscode-badge-background: #333;
        --vscode-badge-foreground: #ddd;
        --vscode-focusBorder: #0a84ff;
        --vscode-input-background: #2a2a2a;
        --vscode-input-foreground: #eee;
        --vscode-input-border: #444;
        --vscode-button-background: #0a84ff;
        --vscode-button-foreground: #fff;
        --vscode-button-secondaryBackground: #3a3a3a;
        --vscode-button-secondaryForeground: #ddd;
      }
      .harness-bar { margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #444; }
    </style>
  </head>
  <body>
    <div class="harness-bar">
      <label for="fixture">Fixture:</label>
      <select id="fixture"></select>
    </div>
    <div id="root"></div>
    <script src="../../out/dev.js"></script>
  </body>
</html>
